name: vAuto
kind: company
description: vAuto is a Cox Automotive brand providing new and used vehicle inventory
  management, appraisal, pricing, and merchandising software for automotive dealers
  (ProfitTime GPS, Provision, Conquest, Stockwave). vAuto exposes partner-gated APIs
  through the Cox Automotive Integration Platform (developer.coxautoinc.com) - notably
  the vAuto Inventory API and the vAuto Appraisal API - that let authorized integrators
  programmatically read vehicle inventory, update list price, and create and access
  appraisals in the vAuto ecosystem. Access is not open self-service; integrators
  must be approved partners, authenticate via Cox Automotive Bridge ID / OAuth with
  an issued API key, and endpoint-level reference documentation is behind the partner
  developer portal login. Per-path endpoints below are modeled from the published
  product summaries, not copied from public reference docs.
